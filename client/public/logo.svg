<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 44" fill="none">
  <!-- Icon mark: dark rounded square with film strip -->
  <rect width="44" height="44" rx="10" fill="#0e0e0d"/>

  <!-- Film perforations left -->
  <rect x="5" y="11" width="5" height="5" rx="1.5" fill="white" opacity="0.5"/>
  <rect x="5" y="28" width="5" height="5" rx="1.5" fill="white" opacity="0.5"/>

  <!-- Film perforations right -->
  <rect x="34" y="11" width="5" height="5" rx="1.5" fill="white" opacity="0.5"/>
  <rect x="34" y="28" width="5" height="5" rx="1.5" fill="white" opacity="0.5"/>

  <!-- Film frame border -->
  <rect x="13" y="7" width="18" height="30" rx="2" stroke="white" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- Play triangle -->
  <polygon points="19,16 19,28 30,22" fill="white"/>

  <!-- Wordmark: CREWUP -->
  <text x="56" y="28" font-family="Inter, -apple-system, sans-serif" font-weight="800" font-size="22" fill="#0e0e0d" letter-spacing="-0.8">CREWUP</text>

  <!-- Wordmark: FILMS -->
  <text x="58" y="40" font-family="Inter, -apple-system, sans-serif" font-weight="600" font-size="10" fill="#d97706" letter-spacing="5">FILMS</text>
</svg>
